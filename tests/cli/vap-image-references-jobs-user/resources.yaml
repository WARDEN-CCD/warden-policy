apiVersion: batch/v1
kind: Job
metadata:
  name: user-job-warden-image
  namespace: svc-books
spec:
  template:
    spec:
      restartPolicy: Never
      containers:
      - name: x
        image: ghcr.io/warden-ccd/svc-books@sha256:38c35b0d18ec85138b41cdca0a9921bdce564331f490063e11b76e40cb2edf24
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        resources:
          requests:
            cpu: 10m
            memory: 64Mi
          limits:
            memory: 128Mi
---
