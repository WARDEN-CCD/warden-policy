apiVersion: batch/v1
kind: Job
metadata:
  name: real-cnpg-initdb-job
  namespace: svc-books
spec:
  backoffLimit: 6
  completionMode: NonIndexed
  completions: 1
  parallelism: 1
  podReplacementPolicy: TerminatingOrFailed
  suspend: false
  template:
    metadata: {}
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: cnpg.io/cluster
                  operator: In
                  values:
                  - cap-db
                - key: cnpg.io/podRole
                  operator: In
                  values:
                  - instance
              topologyKey: kubernetes.io/hostname
            weight: 100
      containers:
      - command:
        - /controller/manager
        - instance
        - init
        - --initdb-flags
        - --encoding=UTF8 --lc-collate=C --lc-ctype=C
        - --app-db-name
        - app
        - --app-user
        - app
        - --log-level=info
        env:
        - name: PGDATA
          value: /var/lib/postgresql/data/pgdata
        - name: POD_NAME
          value: cap-db-1-initdb
        - name: NAMESPACE
          value: svc-cap
        - name: CLUSTER_NAME
          value: cap-db
        - name: PSQL_HISTORY
          value: /controller/tmp/.psql_history
        - name: PGPORT
          value: '5432'
        - name: PGHOST
          value: /controller/run
        - name: TMPDIR
          value: /controller/tmp
        - name: APP_USERNAME
          valueFrom:
            secretKeyRef:
              key: username
              name: cap-db-conn
              optional: false
        image: ghcr.io/cloudnative-pg/postgresql:18.6-system-trixie@sha256:f7e00138159bb45d70b624ba25e446924cb3ed1bf366d13e936c3f81b914064e
        imagePullPolicy: IfNotPresent
        name: initdb
        resources:
          limits:
            memory: 512Mi
          requests:
            cpu: 100m
            memory: 256Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          privileged: false
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          seccompProfile:
            type: RuntimeDefault
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
        volumeMounts:
        - mountPath: /var/lib/postgresql/data
          name: pgdata
        - mountPath: /run
          name: scratch-data
        - mountPath: /controller
          name: scratch-data
        - mountPath: /dev/shm
          name: shm
      dnsPolicy: ClusterFirst
      hostname: cap-db-1-initdb
      initContainers:
      - command:
        - /manager
        - bootstrap
        - /controller/manager
        - --log-level=info
        image: ghcr.io/cloudnative-pg/cloudnative-pg:1.30.1@sha256:923c267ec29636db3bee20f993d0ec4973fa22998e1adad37da79e4d32b5bc07
        imagePullPolicy: IfNotPresent
        name: bootstrap-controller
        resources:
          limits:
            memory: 512Mi
          requests:
            cpu: 100m
            memory: 256Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          privileged: false
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          seccompProfile:
            type: RuntimeDefault
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
        volumeMounts:
        - mountPath: /var/lib/postgresql/data
          name: pgdata
        - mountPath: /run
          name: scratch-data
        - mountPath: /controller
          name: scratch-data
        - mountPath: /dev/shm
          name: shm
      restartPolicy: Never
      schedulerName: default-scheduler
      securityContext:
        fsGroup: 26
        runAsGroup: 26
        runAsNonRoot: true
        runAsUser: 26
        seccompProfile:
          type: RuntimeDefault
      serviceAccount: cap-db
      serviceAccountName: cap-db
      terminationGracePeriodSeconds: 30
      volumes:
      - name: pgdata
        persistentVolumeClaim:
          claimName: cap-db-1
      - emptyDir: {}
        name: scratch-data
      - emptyDir:
          medium: Memory
        name: shm
---
apiVersion: batch/v1
kind: Job
metadata:
  name: op-initdb-job
  namespace: svc-books
spec:
  template:
    spec:
      restartPolicy: Never
      containers:
      - name: initdb
        image: ghcr.io/cloudnative-pg/postgresql:18.6-system-trixie@sha256:f7e00138159bb45d70b624ba25e446924cb3ed1bf366d13e936c3f81b914064e
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        resources:
          requests:
            cpu: 10m
            memory: 64Mi
          limits:
            memory: 128Mi
      initContainers:
      - name: bootstrap-controller
        image: ghcr.io/cloudnative-pg/cloudnative-pg:1.30.1@sha256:923c267ec29636db3bee20f993d0ec4973fa22998e1adad37da79e4d32b5bc07
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        resources:
          requests:
            cpu: 10m
            memory: 64Mi
          limits:
            memory: 128Mi
