# Exercised with real Warden images on kind: attack suite E2 (hub evidence/attacks/). Its shape was first
# validated in spike S1 (hub evidence/spikes/S1.md). Confirmed there:
#   - extractPayload() returns the in-toto statement, so paths start with `.predicate.`
#   - the certificate subject is the reusable workflow's ref, with the org in canonical case WARDEN-CCD
#   - GitHub provenance and cosign bundles are found via GHCR's referrers fallback tag; Rekor v1 entries verify
# initContainers: `images.containers` does not include them, but `required: true` below refuses any matched
# image that no validation verified ("is not verified: no policy performed a signature or attestation check").
# So an unsigned org image cannot be smuggled in as an initContainer (attack A13), and a signed one is refused
# too. The service template uses none; extend the validations if that changes.
#
# Layer 2 of admission (ADR-007): who built it, from what, with which attestations.
# Starts in Audit; flips to Deny at milestone M3 (ADR-020).
apiVersion: policies.kyverno.io/v1
kind: ImageValidatingPolicy
metadata:
  name: warden-verify-supply-chain
  annotations:
    warden.dev/threat-ids: "T02,T03,T04,T05,T07,T08"
    policies.kyverno.io/title: Verify Warden supply chain
    policies.kyverno.io/description: >-
      Admits an image only if it was signed keylessly by Warden's reusable build workflow at a released
      tag, carries a SLSA v1 provenance attestation naming an org-owned svc-* repository and refs/heads/main,
      and carries a CycloneDX SBOM attestation from the same identity.
spec:
  validationActions: [Audit]
  # Audit phase: Ignore. Each cosign verification costs ~8-12 s on kind (Kyverno makes ~30 sequential HTTPS
  # requests per verification, hub EVALUATION E8); a slow verification must not block deploys while auditing.
  # At M3 this flips to Fail together with Deny (ADR-020). Attack-lab clones always use Fail.
  failurePolicy: Ignore
  webhookConfiguration:
    timeoutSeconds: 30
  evaluation:
    background:
      enabled: false
  matchConstraints:
    namespaceSelector:
      matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: NotIn
          values: [kube-system, kube-public, kube-node-lease, local-path-storage, argocd, argo-rollouts, kyverno, envoy-gateway-system, monitoring, crossplane-system, cnpg-system, k6-operator-system]
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["pods"]
  matchImageReferences:
    - glob: "ghcr.io/warden-ccd/*"
  validationConfigurations:
    mutateDigest: false   # VAP already requires digests; never rewrite silently
    verifyDigest: true
    required: true
  attestors:
    - name: wardenBuilder
      cosign:
        keyless:
          identities:
            # Certificate subject of a reusable workflow = the reusable workflow's own ref (ADR-009/010).
            - issuer: https://token.actions.githubusercontent.com
              subjectRegExp: '^https://github\.com/WARDEN-CCD/warden-platform/\.github/workflows/build-sign-attest\.yml@refs/tags/v[0-9]+\.[0-9]+\.[0-9]+$'
        ctlog:
          url: https://rekor.sigstore.dev
  attestations:
    - name: provenance
      intoto:
        type: https://slsa.dev/provenance/v1
    - name: sbom
      intoto:
        type: https://cyclonedx.org/bom
  variables:
    - name: allowedRepoPrefix
      expression: "'https://github.com/WARDEN-CCD/svc-'"
  validations:
    # No separate verifyImageSignatures (ADR-030): Kyverno verifies an attestation only if its signed in-toto
    # subject is this exact digest, so a provenance signed by the build identity proves what the image signature
    # proves (T02 unsigned, T03 foreign signer, T07 modified digest) at one verification less per Pod.
    - message: "T02/T03/T07/T08: no SLSA provenance for this digest signed by Warden's build workflow at a released tag"
      expression: >-
        images.containers.map(image, verifyAttestationSignatures(image, attestations.provenance, [attestors.wardenBuilder])).all(e, e > 0)
    - message: "T04: provenance names a source repository outside WARDEN-CCD/svc-*"
      expression: >-
        images.containers.map(image,
          extractPayload(image, attestations.provenance).predicate.buildDefinition.externalParameters.workflow.repository
            .startsWith(variables.allowedRepoPrefix)).all(e, e)
    - message: "T05: provenance says the image was not built from refs/heads/main"
      expression: >-
        images.containers.map(image,
          extractPayload(image, attestations.provenance).predicate.buildDefinition.externalParameters.workflow.ref
            == 'refs/heads/main').all(e, e)
    - message: "T08: CycloneDX SBOM attestation missing or not signed by Warden's build workflow"
      expression: >-
        images.containers.map(image, verifyAttestationSignatures(image, attestations.sbom, [attestors.wardenBuilder])).all(e, e > 0)
