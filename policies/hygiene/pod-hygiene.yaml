# Layer 3 (ADR-007): golden-path pod defaults, enforced as well as templated. Not threat-model controls
# (messages are prefixed HYG:). Audit until milestone M3 (ADR-020). Tested with tests/hygiene-smoke.sh.
# Security-context rules cover regular, init and ephemeral containers; resources and probes apply to regular
# containers only (init/ephemeral containers have no probes). Ephemeral containers added later through the
# pods/ephemeralcontainers subresource (kubectl debug) are checked by vap-ephemeral-hygiene.yaml in this
# folder: Kyverno's reports controller cannot list/watch that subresource, a native VAP can match it.
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: warden-pod-hygiene
spec:
  validationActions: [Audit]
  matchConstraints:
    namespaceSelector:
      matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: NotIn
          values: [kube-system, kube-public, kube-node-lease, local-path-storage, argocd, argo-rollouts, kyverno, envoy-gateway-system, monitoring, crossplane-system, cnpg-system, k6-operator-system]
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["pods"]
  variables:
    - name: podNonRoot
      expression: >-
        has(object.spec.securityContext) && has(object.spec.securityContext.runAsNonRoot)
        && object.spec.securityContext.runAsNonRoot == true
    - name: init
      expression: "has(object.spec.initContainers) ? object.spec.initContainers : []"
    - name: ephemeral
      expression: "has(object.spec.ephemeralContainers) ? object.spec.ephemeralContainers : []"
  validations:
    # A container-level `runAsNonRoot: false` overrides the pod level, so it must never pass.
    - expression: >-
        object.spec.containers.all(c, has(c.securityContext) && has(c.securityContext.runAsNonRoot)
            ? c.securityContext.runAsNonRoot == true : variables.podNonRoot)
        && variables.init.all(c, has(c.securityContext) && has(c.securityContext.runAsNonRoot)
            ? c.securityContext.runAsNonRoot == true : variables.podNonRoot)
        && variables.ephemeral.all(c, has(c.securityContext) && has(c.securityContext.runAsNonRoot)
            ? c.securityContext.runAsNonRoot == true : variables.podNonRoot)
      messageExpression: "'HYG: every container must run as non-root (runAsNonRoot: true, not overridden to false)'"
    - expression: >-
        object.spec.containers.all(c, has(c.securityContext) && has(c.securityContext.allowPrivilegeEscalation)
            && c.securityContext.allowPrivilegeEscalation == false)
        && variables.init.all(c, has(c.securityContext) && has(c.securityContext.allowPrivilegeEscalation)
            && c.securityContext.allowPrivilegeEscalation == false)
        && variables.ephemeral.all(c, has(c.securityContext) && has(c.securityContext.allowPrivilegeEscalation)
            && c.securityContext.allowPrivilegeEscalation == false)
      messageExpression: "'HYG: allowPrivilegeEscalation must be false on every container'"
    - expression: >-
        object.spec.containers.all(c, has(c.securityContext) && has(c.securityContext.readOnlyRootFilesystem)
            && c.securityContext.readOnlyRootFilesystem == true)
        && variables.init.all(c, has(c.securityContext) && has(c.securityContext.readOnlyRootFilesystem)
            && c.securityContext.readOnlyRootFilesystem == true)
        && variables.ephemeral.all(c, has(c.securityContext) && has(c.securityContext.readOnlyRootFilesystem)
            && c.securityContext.readOnlyRootFilesystem == true)
      messageExpression: "'HYG: readOnlyRootFilesystem must be true on every container'"
    - expression: >-
        object.spec.containers.all(c, has(c.securityContext) && has(c.securityContext.capabilities)
            && has(c.securityContext.capabilities.drop) && 'ALL' in c.securityContext.capabilities.drop
            && (!has(c.securityContext.capabilities.add)
                || c.securityContext.capabilities.add.all(a, a == 'NET_BIND_SERVICE')))
        && variables.init.all(c, has(c.securityContext) && has(c.securityContext.capabilities)
            && has(c.securityContext.capabilities.drop) && 'ALL' in c.securityContext.capabilities.drop
            && (!has(c.securityContext.capabilities.add)
                || c.securityContext.capabilities.add.all(a, a == 'NET_BIND_SERVICE')))
        && variables.ephemeral.all(c, has(c.securityContext) && has(c.securityContext.capabilities)
            && has(c.securityContext.capabilities.drop) && 'ALL' in c.securityContext.capabilities.drop
            && (!has(c.securityContext.capabilities.add)
                || c.securityContext.capabilities.add.all(a, a == 'NET_BIND_SERVICE')))
      messageExpression: "'HYG: every container must drop ALL capabilities and add none but NET_BIND_SERVICE'"
    - expression: >-
        object.spec.containers.all(c, !has(c.securityContext) || !has(c.securityContext.privileged)
            || c.securityContext.privileged == false)
        && variables.init.all(c, !has(c.securityContext) || !has(c.securityContext.privileged)
            || c.securityContext.privileged == false)
        && variables.ephemeral.all(c, !has(c.securityContext) || !has(c.securityContext.privileged)
            || c.securityContext.privileged == false)
      messageExpression: "'HYG: privileged containers are not allowed'"
    - expression: >-
        object.spec.containers.all(c, has(c.resources) && has(c.resources.requests)
          && 'cpu' in c.resources.requests && 'memory' in c.resources.requests
          && has(c.resources.limits) && 'memory' in c.resources.limits)
      messageExpression: "'HYG: containers need cpu/memory requests and a memory limit'"
    - expression: "object.spec.containers.all(c, has(c.readinessProbe) && has(c.livenessProbe))"
      messageExpression: "'HYG: containers need readiness and liveness probes'"
