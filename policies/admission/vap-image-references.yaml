# Encodes ADR-007. Active on the kind cluster since 2026-10-24 (Audit+Warn); Deny+Audit from hub ADR-032.
# Tested with tests/cli (kyverno test) and tests/vap-smoke.sh.
#
# Layer 1 of admission: cheap invariants enforced in-process by the API server (no webhook to fail).
#   - images must come from the Warden registry prefix (stops IVP-matching bypass, T06)
#   - images must be pinned by digest (stops tag repointing, T01)
# Applied to Pods and to Argo Rollouts templates, so a bad Rollout fails at Argo CD sync time
# instead of as ReplicaSet events.
#
# GHCR paths are lowercase, so the GitHub org WARDEN-CCD appears here as warden-ccd.
# The NotIn list must equal `platformNamespaces` in the hub's workspace.yaml (scripts/verify.py checks).
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: warden-image-references-pods
  annotations:
    warden.dev/threat-ids: "T01,T06"
spec:
  failurePolicy: Fail
  matchConstraints:
    namespaceSelector:
      matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: NotIn
          values: [kube-system, kube-public, kube-node-lease, local-path-storage, argocd, argo-rollouts, kyverno, envoy-gateway-system, monitoring, crossplane-system, cnpg-system, k6-operator-system]
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["pods", "pods/ephemeralcontainers"]
  variables:
    - name: images
      expression: >-
        object.spec.containers.map(c, c.image)
        + (has(object.spec.initContainers) ? object.spec.initContainers.map(c, c.image) : [])
        + (has(object.spec.ephemeralContainers) ? object.spec.ephemeralContainers.map(c, c.image) : [])
    # Carve-out (THREAT_MODEL T06): PostgreSQL pods for a service's Database run the official CNPG image. Exempt
    # only when (a) the request comes from the CloudNativePG operator's service account (not a label the
    # requester controls), (b) the image is one of the exact digests the database-cnpg composition pins, and
    # (c) it is a regular or init container, never an ephemeral one.
    - name: fromCnpgOperator
      expression: "request.userInfo.username == 'system:serviceaccount:cnpg-system:cloudnative-pg'"
    - name: cnpgImages
      expression: >-
        ['ghcr.io/cloudnative-pg/postgresql:18.6-system-trixie@sha256:f7e00138159bb45d70b624ba25e446924cb3ed1bf366d13e936c3f81b914064e',
         'ghcr.io/cloudnative-pg/postgresql:17.11-system-trixie@sha256:ae22bdd6008e02c18180c84192b3afbc95a758a184899f1cb7e85ed9c3ef8128']
    - name: ephemeralImages
      expression: "has(object.spec.ephemeralContainers) ? object.spec.ephemeralContainers.map(c, c.image) : []"
    - name: disallowed
      expression: >-
        variables.images.filter(i, !(i.startsWith('ghcr.io/warden-ccd/')
          || (variables.fromCnpgOperator && i in variables.cnpgImages && !(i in variables.ephemeralImages))))
  validations:
    - expression: "size(variables.disallowed) == 0"
      messageExpression: "'T06: image not from ghcr.io/warden-ccd/: ' + variables.disallowed.join(', ')"
    - expression: "variables.images.all(i, i.matches('@sha256:[a-f0-9]{64}$'))"
      messageExpression: >-
        'T01: image must be pinned by digest (name@sha256:...): '
        + variables.images.filter(i, !i.matches('@sha256:[a-f0-9]{64}$')).join(', ')
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: warden-image-references-pods
spec:
  policyName: warden-image-references-pods
  validationActions: [Deny, Audit]   # staged M3 (hub ADR-032); break-glass: set back to [Audit, Warn] in a PR
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: warden-image-references-rollouts
  annotations:
    warden.dev/threat-ids: "T01,T06"
spec:
  failurePolicy: Fail
  matchConstraints:
    namespaceSelector:
      matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: NotIn
          values: [kube-system, kube-public, kube-node-lease, local-path-storage, argocd, argo-rollouts, kyverno, envoy-gateway-system, monitoring, crossplane-system, cnpg-system, k6-operator-system]
    resourceRules:
      - apiGroups: ["argoproj.io"]
        apiVersions: ["v1alpha1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["rollouts"]
  variables:
    - name: images
      # Rollouts in Warden always embed a template (no workloadRef); see the service template.
      expression: >-
        object.spec.template.spec.containers.map(c, c.image)
        + (has(object.spec.template.spec.initContainers) ? object.spec.template.spec.initContainers.map(c, c.image) : [])
  validations:
    - expression: "variables.images.all(i, i.startsWith('ghcr.io/warden-ccd/'))"
      message: "T06: Rollout template uses an image outside ghcr.io/warden-ccd/"
    - expression: "variables.images.all(i, i.matches('@sha256:[a-f0-9]{64}$'))"
      message: "T01: Rollout template image must be pinned by digest"
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: warden-image-references-rollouts
spec:
  policyName: warden-image-references-rollouts
  validationActions: [Deny, Audit]   # staged M3 (hub ADR-032); break-glass: set back to [Audit, Warn] in a PR
